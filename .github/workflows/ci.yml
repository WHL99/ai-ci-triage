name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build Docker Image
        run: npm run docker:build

      - name: Smoke Test
        id: smoke-test
        run: |
          docker run -d -p 3000:3000 --name app ai-ci-triage
          curl --retry-connrefused --retry 5 --retry-delay 2 --retry-all-errors --fail http://localhost:3000/health

      - name: Print Logs When Smoke Test fails
        if: ${{ failure() && steps.smoke-test.conclusion == 'failure' }}
        run: docker logs app
